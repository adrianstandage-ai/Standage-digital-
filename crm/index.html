<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chase CRM</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#12212B">
<style>
/* ===== THEME: change only this block to re-skin the whole app ===== */
:root{
  --bg:#F4F1EA;            /* page */
  --bg2:#EAE5D9;           /* soft panels, chips */
  --card:#FFFFFF;
  --ink:#12212B;           /* main text */
  --mute:#66727A;          /* secondary text */
  --line:#E3DED2;
  --acc:#F2B705;           /* main accent (buttons, active tab) */
  --acc-ink:#12212B;       /* text on the accent */
  --hero:#12212B;          /* summary banner */
  --hero-ink:#FFFFFF;
  --warn:#C8421C;          /* overdue / today */
  --warn-bg:#FBE9E2;
  --ok:#1F8A5B;
  --st-lead:#4F7CE0;--st-talking:#E08A1E;--st-mockup:#8A5CD6;--st-won:#1F8A5B;--st-lost:#8A949A;--st-dnc:#C8421C;
  --radius:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(18,33,43,.06),0 6px 18px rgba(18,33,43,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0E1A22;--bg2:#1A2B36;--card:#16252F;--ink:#EEF2F4;--mute:#9AABB5;--line:#26394A;
  --hero:#F2B705;--hero-ink:#12212B;--warn:#FF8F66;--warn-bg:#3A2420;--ok:#4FD19A;
  --st-lead:#7FA2FF;--st-talking:#FFB454;--st-mockup:#B795FF;--st-won:#4FD19A;--st-lost:#8FA0AA;--st-dnc:#FF8F66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
/* ================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);padding-bottom:110px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.date{color:var(--mute);font-size:13px;margin-top:2px}
main{padding:0 16px}
button{font:inherit;cursor:pointer;transition:transform .12s ease,filter .12s ease}
button:active,.btn:active{transform:scale(.96)}
button.add{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:26px;line-height:1;font-weight:600;box-shadow:var(--shadow)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(360px,calc(100% - 28px));display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow);z-index:5}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 6px;background:none;border:0;border-radius:999px;color:var(--mute);font-size:14px;font-weight:600}
.tabs button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 20px;margin:6px 0 6px;box-shadow:var(--shadow)}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .lbl{font-size:15px;opacity:.85;margin-top:6px}
.hero .chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .chips span{background:rgba(255,255,255,.14);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
@media(prefers-color-scheme:dark){.hero .chips span{background:rgba(18,33,43,.14)}}
h2{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin:22px 4px 10px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin:0 0 10px;box-shadow:var(--shadow);position:relative;transition:transform .12s ease}
.card:active{transform:scale(.985)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:var(--st-lead)}
.card[data-st="Talking"] .av{background:var(--st-talking)}.card[data-st="Mock-up sent"] .av{background:var(--st-mockup)}
.card[data-st="Won"] .av{background:var(--st-won)}.card[data-st="Lost"] .av{background:var(--st-lost)}.card[data-st="Do not contact"] .av{background:var(--st-dnc)}
.cb{min-width:0;flex:1}
.cb b{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.sub{color:var(--mute);font-size:14px;margin-top:3px}
.due{color:var(--warn);font-weight:700;font-size:14px;margin-top:5px}
.due.late{background:var(--warn-bg);display:inline-block;padding:2px 9px;border-radius:99px}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--mute)}
.pill.st{background:none;color:var(--ink);padding-left:0;display:inline-flex;align-items:center;gap:6px}
.pill.st:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st-lead)}
.card[data-st="Talking"] .pill.st:before{background:var(--st-talking)}.card[data-st="Mock-up sent"] .pill.st:before{background:var(--st-mockup)}
.card[data-st="Won"] .pill.st:before{background:var(--st-won)}.card[data-st="Lost"] .pill.st:before{background:var(--st-lost)}.card[data-st="Do not contact"] .pill.st:before{background:var(--st-dnc)}
button.p,.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;display:inline-block;box-shadow:var(--shadow)}
button.s{background:var(--bg2);color:var(--ink);border:0;border-radius:12px;padding:10px 13px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cb .row .btn{padding:10px 14px;box-shadow:none}
.cb .row .btn.wa{background:var(--ok);color:#fff}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 2px 5px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);vertical-align:-4px;margin-right:6px}
.empty{color:var(--mute);text-align:center;padding:40px 10px;font-size:15px}
.empty i{display:block;font-style:normal;font-size:38px;margin-bottom:6px}
textarea.big{height:160px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
.fade{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}*{transition:none!important}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;min-width:0}
.tile .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.tile .t{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.tile.late .n{color:var(--warn)}
.ring{flex:none;width:46px;height:46px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:var(--bg2)}.ring .fg{stroke:var(--acc);transition:stroke-dashoffset .8s ease}
.tile.wide{grid-column:span 2}
.mini{display:flex;gap:6px;align-items:flex-end;height:46px;flex:1}.mini i{flex:1;background:var(--bg2);border-radius:6px 6px 3px 3px;min-height:6px;position:relative}.mini i b{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 3px 3px;background:var(--acc)}
.mlbl{display:flex;gap:6px;font-size:11px;color:var(--mute);font-weight:600;margin-top:4px}.mlbl span{flex:1;text-align:center}
.slot{color:var(--mute);font-size:14px;text-align:center;padding:16px;border:1.5px dashed var(--line);border-radius:var(--radius);margin:0 0 10px}
/* ===== VOICE ===== */
.mic{position:fixed;right:18px;bottom:96px;z-index:30;width:58px;height:58px;border-radius:50%;border:0;background:var(--hero);color:var(--hero-ink);box-shadow:var(--shadow),0 8px 22px rgba(0,0,0,.22);display:grid;place-items:center}
.mic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.28);padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:78vh;display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet .top b{font-size:17px}
.log{overflow:auto;flex:1;min-height:90px;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.bub{max-width:86%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.35;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:5px}
.bub.bot{align-self:flex-start;background:var(--bg2);color:var(--ink);border-bottom-left-radius:5px}
.vrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.vrow input{flex:1}
.vrow button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;background:var(--bg2);color:var(--ink)}
.vrow button.go{background:var(--acc);color:var(--acc-ink)}
.vrow button.lis{background:var(--warn);color:#fff}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.bar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:5px 0 12px}.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.frow{display:flex;justify-content:space-between;font-size:14px;font-weight:600}.frow span:last-child{color:var(--mute);font-weight:500}
.stg{font-size:15px;font-weight:800;margin:18px 2px 8px;display:flex;justify-content:space-between}.stg span{color:var(--mute);font-weight:600}
</style></head><body><div class="wrap">
<header><div><h1 id="ttl">Chase</h1><div class="date" id="dt"></div></div><button class="add" onclick="edit()" aria-label="Add contact">+</button></header>
<main id="v"></main></div>
<nav class="tabs"><button id="t0" onclick="tab(0)"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Chase</button><button id="t3" onclick="tab(3)"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Deals</button><button id="t1" onclick="tab(1)"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3-6 6.5-6s6 2 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .6 3.3 2.4 3.5 6"/></svg>All</button><button id="t2" onclick="tab(2)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Data</button></nav>
<button class="mic" id="mic" aria-label="Talk to Chase" onclick="vOpen()"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<div class="sheet" id="sheet"><div class="top"><b>Talk to Chase</b><button class="s" onclick="vClose()" style="border:0;background:none;color:var(--mute);font-size:15px">Close</button></div>
<div class="log" id="vlog"></div>
<div class="vrow"><input id="vin" placeholder="Type or tap the mic" autocomplete="off"><button class="go" onclick="vSend()">Send</button><button id="vlis" onclick="vListen()">Mic</button></div>
<div class="hint">Try: "add Jo from Jo's Cafe, remind me Friday" · "who do I chase" · "done Jo" · "snooze Jo to Monday"</div></div>
<script>
const KEY='chase-crm-v1',STAGES=['Lead','Talking','Mock-up sent','Won','Lost','Do not contact'];
let db=[],T=0,Q='',F='';
try{db=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save on this browser')}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date()),addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const nice=d=>d?new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'';
const open=c=>!['Won','Lost','Do not contact'].includes(c.stage);
const ini=c=>{const w=String(c.name||c.business||'?').trim().split(/\s+/);return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()};
function card(c,extra='',i=0){const od=c.next&&c.next<today(),dt=c.next===today();
return `<div class="card fade" style="animation-delay:${Math.min(i,8)*35}ms" data-st="${esc(c.stage)}" onclick="edit('${c.id}')"><div class="av">${esc(ini(c))}</div><div class="cb"><b>${esc(c.name||c.business)}${c.business&&c.name?' · '+esc(c.business):''}</b>
<div class="tags"><span class="pill st">${esc(c.stage)}</span>${c.trade?`<span class="pill">${esc(c.trade)}</span>`:''}${+c.value?`<span class="pill">£${(+c.value).toLocaleString('en-GB')}</span>`:''}${c.emailOk?'<span class="pill">emails ok</span>':''}</div>
${c.action||c.next?`<div class="${od||dt?'due late':'sub'}">${od?'Overdue · ':dt?'Today · ':''}${nice(c.next)} ${esc(c.action)}</div>`:''}
${c.notes?`<div class="sub">${esc(c.notes).slice(0,90)}</div>`:''}${extra}</div></div>`}
function chaseCard(c,i){const ph=c.phone||'';return card(c,`<div class="row" onclick="event.stopPropagation()"><button class="s" onclick="done('${c.id}')">Done</button><button class="s" onclick="snooze('${c.id}',1)">+1 day</button><button class="s" onclick="snooze('${c.id}',7)">+1 week</button>${ph?`<a class="btn" href="tel:${esc(ph)}">Call</a>`:''}${ph?`<a class="btn wa" href="https://wa.me/${esc(ph.replace(/\D/g,'').replace(/^0/,'44'))}">WhatsApp</a>`:''}</div>`,i)}
const gbp0=n=>'£'+Math.round(n).toLocaleString('en-GB');
function ring(p){const r=19,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="${r}"/><circle class="fg" cx="23" cy="23" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,p)))}"/></svg>`}
function dash(due,soon,od){const o=db.filter(open),w=db.filter(c=>c.stage==='Won'),l=db.filter(c=>c.stage==='Lost'),val=a=>a.reduce((x,c)=>x+(+c.value||0),0),rate=w.length+l.length?w.length/(w.length+l.length):0,t=today(),tod=due.filter(c=>c.next===t).length;
const P=['Lead','Talking','Mock-up sent','Won'],cn=P.map(k=>db.filter(c=>c.stage===k).length),mx=Math.max(1,...cn),tot=Math.max(1,db.length);
return `<div class="tiles fade"><div class="tile ${od?'late':''}">${ring(od?1:0)}<div><div class="n">${od}</div><div class="t">Overdue</div></div></div>
<div class="tile">${ring(tod/Math.max(1,due.length||1)*(tod?1:0))}<div><div class="n">${tod}</div><div class="t">Due today</div></div></div>
<div class="tile">${ring(o.length/tot)}<div><div class="n">${o.length}</div><div class="t">Open deals</div></div></div>
<div class="tile">${ring(Math.min(1,soon.length/10))}<div><div class="n">${soon.length}</div><div class="t">Coming up</div></div></div>
<div class="tile">${ring(0)}<div><div class="n">${gbp0(val(o))}</div><div class="t">Pipeline</div></div></div>
<div class="tile">${ring(rate)}<div><div class="n">${Math.round(rate*100)}%</div><div class="t">Win rate</div></div></div>
<div class="tile wide"><div style="flex:1"><div class="t" style="margin:0 0 8px">Funnel</div><div class="mini">${cn.map(n=>`<i><b style="height:${Math.round(100*n/mx)}%"></b></i>`).join('')}</div><div class="mlbl">${P.map((k,i)=>`<span>${k.replace('Mock-up sent','Mock-up')} ${cn[i]}</span>`).join('')}</div></div></div></div>`}
function tab(n){T=n;render()}
function render(){document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',b.id==='t'+T));const v=$('#v');
$('#dt').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});window.scrollTo(0,0);
if(T===0){const t=today(),act=db.filter(c=>open(c)&&c.next);const due=act.filter(c=>c.next<=t).sort((a,b)=>a.next>b.next?1:-1),soon=act.filter(c=>c.next>t).sort((a,b)=>a.next>b.next?1:-1),none=db.filter(c=>open(c)&&!c.next);
$('#ttl').textContent='Chase';
const won=db.filter(c=>c.stage==='Won').length,openN=db.filter(open).length;
const od=due.filter(c=>c.next<t).length;
v.innerHTML=`<div class="hero fade"><div class="big">${due.length}</div><div class="lbl">${due.length===0?'Nothing to chase right now':due.length===1?'person to chase now':'people to chase now'}</div><div class="chips"><span>${openN} open</span><span>${soon.length} coming up</span><span>${won} won</span></div></div>`+dash(due,soon,od)
+'<h2>Chase now</h2>'+(due.length?due.map(chaseCard).join(''):'<div class="slot">Nobody to chase. Add someone with the + button.</div>')
+'<h2>Coming up</h2>'+(soon.length?soon.map((c,i)=>card(c,'',i)).join(''):'<div class="slot">Reminders you set show here.</div>')
+(none.length?'<h2>No date set</h2>'+none.map((c,i)=>card(c,'',i)).join(''):'')}
if(T===3){$('#ttl').textContent='Deals';const PIPE=['Lead','Talking','Mock-up sent','Won'],val=c=>+c.value||0,sum=a=>a.reduce((x,c)=>x+val(c),0),gbp=n=>'£'+n.toLocaleString('en-GB');
const op=db.filter(open),won=db.filter(c=>c.stage==='Won'),lost=db.filter(c=>c.stage==='Lost'),rate=won.length+lost.length?Math.round(100*won.length/(won.length+lost.length)):null;
const maxN=Math.max(1,...PIPE.map(k=>db.filter(c=>c.stage===k).length));
v.innerHTML=`<div class="hero fade"><div class="big">${gbp(sum(op))}</div><div class="lbl">in your open pipeline</div><div class="chips"><span>${op.length} open</span><span>${gbp(sum(won))} won</span>${rate!==null?`<span>${rate}% win rate</span>`:''}</div></div>
<div class="panel fade"><b>Funnel</b><div style="height:8px"></div>${PIPE.map(k=>{const a=db.filter(c=>c.stage===k);return `<div class="frow"><span>${k}</span><span>${a.length}${sum(a)?' · '+gbp(sum(a)):''}</span></div><div class="bar"><i style="width:${Math.round(100*a.length/maxN)}%"></i></div>`}).join('')}</div>`+
PIPE.slice(0,3).map(k=>{const a=db.filter(c=>c.stage===k);return `<div class="stg">${k}<span>${a.length}${sum(a)?' · '+gbp(sum(a)):''}</span></div>`+(a.map((c,i)=>card(c,`<div class="row" onclick="event.stopPropagation()"><button class="s" onclick="moveOn('${c.id}')">Move to ${PIPE[PIPE.indexOf(k)+1]} →</button></div>`,i)).join('')||'<div class="sub" style="margin:0 2px 8px">Nobody here yet.</div>')}).join('')}
if(T===1){$('#ttl').textContent='All contacts';const q=Q.toLowerCase();const l=db.filter(c=>(!F||c.stage===F)&&(!q||JSON.stringify(c).toLowerCase().includes(q)));
v.innerHTML=`<input placeholder="Search" value="${esc(Q)}" oninput="Q=this.value;render2()" id="q"><div class="row"><select onchange="F=this.value;render()"><option value="">All stages</option>${STAGES.map(s=>`<option ${F===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="list" style="margin-top:14px">${l.map((c,i)=>card(c,'',i)).join('')||'<div class="empty"><i>🔍</i>None yet. Tap + Add.</div>'}</div>`}
if(T===2){$('#ttl').textContent='Data';v.innerHTML=`<div class="panel fade"><b>Your contacts live on this phone only.</b><div class="sub">Copy a backup now and then.</div></div>
<div class="row"><button class="p" onclick="copy('csv')">Copy as CSV</button><button class="s" onclick="share()">Share CSV</button><button class="s" onclick="dl()">Download CSV</button></div>
<div class="row"><button class="s" onclick="copy('json')">Copy backup</button></div>

function moveOn(id){const c=db.find(x=>x.id===id),P=['Lead','Talking','Mock-up sent','Won'];c.stage=P[Math.min(3,P.indexOf(c.stage)+1)];if(c.stage==='Won'){c.next='';c.action=''}c.updated=today();save();render()}
function render2(){const q=Q.toLowerCase();$('#list').innerHTML=db.filter(c=>(!F||c.stage===F)&&(!q||JSON.stringify(c).toLowerCase().includes(q))).map((c,i)=>card(c,'',i)).join('')}
function grp(){const g={};db.filter(c=>c.emailOk&&c.stage!=='Do not contact').forEach(c=>(g[c.trade||'(no trade)']??=[]).push(c.name||c.business));return Object.entries(g).map(([k,v])=>`<b>${esc(k)}</b> ${esc(v.join(', '))}`).join('<br>')||'None yet. Tick "emails ok" only for customers or people who said yes.'}
function edit(id){const c=db.find(x=>x.id===id)||{stage:'Lead'};$('#ttl').textContent=id?'Edit':'Add contact';window.scrollTo(0,0);
const f=(k,l,t='text')=>`<label>${l}</label><input type="${t}" id="f_${k}" value="${esc(c[k])}">`;
$('#v').innerHTML='<div class="fade">'+f('name','Name')+f('business','Business')+f('trade','Trade (cleaner, barber…)')+f('phone','Phone','tel')+f('email','Email','email')+
`<label>Stage</label><select id="f_stage">${STAGES.map(s=>`<option ${c.stage===s?'selected':''}>${s}</option>`).join('')}</select>`+
f('value','Deal value (£)','number')+f('how','How we met')+f('action','Next action')+`<label>Remind me on</label><input type="date" id="f_next" value="${esc(c.next)}"><div class="row"><button class="s" onclick="qd(1)">Tomorrow</button><button class="s" onclick="qd(3)">3 days</button><button class="s" onclick="qd(7)">Next week</button></div>`+
`<label>Notes</label><textarea id="f_notes" rows="4">${esc(c.notes)}</textarea><label><input type="checkbox" id="f_emailOk" ${c.emailOk?'checked':''}> Emails ok (customer, or said yes to emails)</label>
<div class="row" style="margin-top:18px"><button class="p" onclick="sv('${id||''}')">Save</button><button class="s" onclick="render()">Cancel</button>${id?`<button class="s" onclick="del('${id}')">Delete</button>`:''}</div></div>`}
function qd(n){$('#f_next').value=addDays(n)}
function sv(id){const c=db.find(x=>x.id===id)||{id:'c'+Date.now().toString(36),created:today()};
['name','business','trade','phone','email','stage','value','how','action','next','notes'].forEach(k=>c[k]=$('#f_'+k).value.trim());c.emailOk=$('#f_emailOk').checked;c.updated=today();
if(!c.name&&!c.business){alert('Add a name or business');return}if(!db.includes(c))db.push(c);save();T=0;render()}
function del(id){if(confirm('Delete this contact?')){db=db.filter(c=>c.id!==id);save();T=1;render()}}
function done(id){const c=db.find(x=>x.id===id);c.next='';c.action='';c.updated=today();save();render()}
function snooze(id,n){db.find(x=>x.id===id).next=addDays(n);save();render()}
const COLS=['name','business','trade','stage','value','phone','email','how','action','next','emailOk','notes','created'];
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return [COLS.join(','),...db.map(c=>COLS.map(k=>q(c[k])).join(','))].join('\n')}
async function copy(w){const t=w==='csv'?csv():JSON.stringify(db);try{await navigator.clipboard.writeText(t);alert('Copied')}catch(e){T=2;prompt('Copy this',t)}}
async function share(){try{await navigator.share({title:'Contacts',text:csv()})}catch(e){}}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv'}));a.download='contacts.csv';a.click()}
function parseCSV(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(f);f=''}else if(ch=='\n'){row.push(f);r.push(row);row=[];f=''}else if(ch!='\r')f+=ch}row.push(f);r.push(row);return r}
function imp(){const t=$('#imp').value.trim();if(!t)return;let add=[];try{if(t[0]=='['||t[0]=='{')add=JSON.parse(t);else{const r=parseCSV(t),h=r[0];add=r.slice(1).filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]])))}}catch(e){alert('Could not read that');return}
add.forEach(a=>{a.id=a.id||'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);a.stage=STAGES.includes(a.stage)?a.stage:'Lead';a.emailOk=a.emailOk===true||a.emailOk==='true';if(!db.some(c=>c.id===a.id))db.push(a)});save();alert('Imported '+add.length);render()}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ===== VOICE: free in-browser speech, no AI service, data stays on the phone ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let vRec=null,vPend=null,vOn=false,vSpeak=true;
const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'],MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
const NUMW={a:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
function parseWhen(t){let m,n=null;
 if(m=t.match(/\bin (\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten) (day|days|week|weeks)\b/)){const q=NUMW[m[1]]||+m[1];n=q*(m[2][0]=='w'?7:1)}
 else if(m=t.match(/\bday after tomorrow\b/))n=2;
 else if(m=t.match(/\btomorrow\b/))n=1;
 else if(m=t.match(/\b(today|tonight|this evening)\b/))n=0;
 else if(m=t.match(/\bnext week\b/))n=7;
 else if(m=t.match(/\b(?:on |next |this )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/)){const k=DAYS.indexOf(m[1]);n=(k-new Date().getDay()+7)%7||7}
 else if(m=t.match(new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?(?: of)? ('+MONTHS.join('|')+')\\b'))||(m=t.match(new RegExp('\\b('+MONTHS.join('|')+') (\\d{1,2})(?:st|nd|rd|th)?\\b'))&&(m=[m[0],m[2],m[1]]))){const d=new Date(),k=MONTHS.indexOf(m[2]);let y=d.getFullYear();let x=new Date(y,k,+m[1]);if(x<new Date(y,d.getMonth(),d.getDate()))x=new Date(y+1,k,+m[1]);return{date:iso(x),rest:t.replace(m[0],' ')}}
 if(n===null)return{date:null,rest:t};return{date:addDays(n),rest:t.replace(m[0],' ')}}
const tc=s=>s.replace(/(^|\s)\w/g,c=>c.toUpperCase());
function findC(q){q=q.toLowerCase().replace(/[^a-z0-9' ]/g,' ').trim();if(!q)return[];const w=q.split(/\s+/);
 return db.filter(c=>{const h=((c.name||'')+' '+(c.business||'')).toLowerCase().replace(/[^a-z0-9' ]/g,' ');return w.every(x=>h.includes(x))})}
function who(c){return c.name||c.business}
function say(t){const l=$('#vlog');l.insertAdjacentHTML('beforeend',`<div class="bub bot">${esc(t)}</div>`);l.scrollTop=l.scrollHeight;
 if(vSpeak&&window.speechSynthesis){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\n/g,'. '));u.lang='en-GB';speechSynthesis.speak(u)}catch(e){}}}
function me(t){const l=$('#vlog');l.insertAdjacentHTML('beforeend',`<div class="bub me">${esc(t)}</div>`);l.scrollTop=l.scrollHeight}
function when(d){return d===today()?'today':d===addDays(1)?'tomorrow':nice(d)}
function chaseList(){const t=today(),due=db.filter(c=>open(c)&&c.next&&c.next<=t).sort((a,b)=>a.next>b.next?1:-1);
 if(!due.length)return 'Nothing to chase today. Nice.';return `You have ${due.length} to chase:\n`+due.slice(0,6).map(c=>`${who(c)}${c.action?', '+c.action:''}`).join('\n')+(due.length>6?`\nand ${due.length-6} more.`:'')}
function pickOne(q,verb){const r=findC(q);if(!r.length){say(`I can't find anyone called "${q}".`);return null}
 if(r.length>1){say(`Which one: ${r.slice(0,4).map(who).join(', or ')}? Say the full name.`);return null}return r[0]}
function vHandle(raw){let t=raw.toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim();if(!t)return;me(raw);
 if(vPend){const p=vPend;vPend=null;if(/^(no|none|nope|skip|never mind|nothing)\b/.test(t)){say(`OK, ${who(p)} saved with no reminder.`);return}
  const w=parseWhen(t);if(w.date){p.next=w.date;p.updated=today();save();render();say(`Reminder set for ${who(p)}, ${when(w.date)}.`);return}say("Sorry, I didn't catch the day. Say something like tomorrow, Friday or in 3 days, or say skip.");vPend=p;return}
 let m;
 if(/^(help|what can you do)/.test(t)){say('You can say: add Jo from Jo\'s Cafe, remind me Friday. Who do I chase. Done Jo. Snooze Jo to Monday. Mark Jo as won. Tell me about Jo.');return}
 if(/\b(who|what)\b.*\b(chase|due|overdue|follow|do i need|today)\b|^(chase list|what'?s due|anything due)/.test(t)){say(chaseList());return}
 if(m=t.match(/^(?:add|new contact|create contact|create|save)\s+(?:a |an )?(?:new )?(?:contact |lead )?(.+)$/)){let s=m[1];const w=parseWhen(s);s=w.rest;let val='';const vm=s.match(/(?:worth |valued at |value of )?£\s?(\d[\d,]*)|worth (\d[\d,]*)|(\d[\d,]*) (?:pounds|quid)/);if(vm){val=(vm[1]||vm[2]||vm[3]).replace(/,/g,'');s=s.replace(vm[0],' ')}
  let action='';const am=s.match(/\b(?:remind me|reminder|chase|follow up|and remind me)\b\s*(?:to |about |on |for )?(.*)$/);if(am){action=am[1].trim();s=s.slice(0,am.index)}
  s=s.replace(/[, ]+(?:and|then)\s*$/,'').replace(/[,]+$/,'').trim();let note='';const nm=s.match(/\b(?:note|notes|met (?:at|through|on)|they)\b\s*(.*)$/);if(nm){note=(nm[0]).trim();s=s.slice(0,nm.index).trim()}
  let trade='';const tm=s.match(/\b(?:trade|they're a|she's a|he's a|a)\s+(cleaner|barber|plumber|electrician|builder|baker|florist|hairdresser|cafe|restaurant|accountant|bookkeeper|garage|mechanic|roofer|decorator|gardener|photographer|trainer|therapist|beautician)s?$/);if(tm){trade=tm[1];s=s.slice(0,tm.index).trim()}
  let name=s,biz='';const bm=s.match(/^(.+?)\s+(?:from|at|of|who runs|runs|owns)\s+(.+)$/);if(bm){name=bm[1];biz=bm[2]}
  name=name.replace(/[, ]+$/,'').trim();if(!name){say('Who is the contact called?');return}
  const c={id:'c'+Date.now().toString(36),created:today(),updated:today(),name:tc(name),business:tc(biz.replace(/[, ]+$/,'')),trade,value:val,stage:'Lead',action:action||'Chase',next:w.date||'',notes:note,emailOk:false};
  db.push(c);save();render();
  if(w.date)say(`Added ${who(c)}${c.business&&c.name?' from '+c.business:''}. Reminder ${when(w.date)}.`);else{say(`Added ${who(c)}. When should I remind you? Say a day, or skip.`);vPend=c}return}
 if(m=t.match(/^(?:done|chased|finished|completed|tick off|i'?ve (?:chased|called|messaged|spoken to))\s+(.+)$/)){const c=pickOne(m[1]);if(c){c.next='';c.action='';c.updated=today();save();render();say(`Done. ${who(c)} is off your chase list.`)}return}
 if(m=t.match(/^(?:snooze|remind me about|remind me to chase|chase|follow up with|follow up|push|move)\s+(.+)$/)){const w=parseWhen(m[1]);const c=pickOne(w.rest.replace(/\b(to|until|for|on)\s*$/,'').trim());if(c){if(!w.date){say(`When should I remind you about ${who(c)}?`);vPend=c;return}c.next=w.date;if(!c.action)c.action='Chase';c.updated=today();save();render();say(`OK, ${who(c)} is ${when(w.date)}.`)}return}
 if(/\b(how much|what'?s|what is|total)\b.*\b(pipeline|deals|worth|value)\b/.test(t)){const o=db.filter(open),n=o.reduce((x,c)=>x+(+c.value||0),0);say(`${o.length} open, worth £${n.toLocaleString('en-GB')} in the pipeline.`);return}
 if(m=t.match(/^(?:set |change )?(.+?)(?:'s)?\s+(?:value|worth|is worth|deal)\s+(?:to |at |is )?£?\s?(\d[\d,]*)/)){const c=pickOne(m[1]);if(c){c.value=m[2].replace(/,/g,'');c.updated=today();save();render();say(`${who(c)} is now worth £${(+c.value).toLocaleString('en-GB')}.`)}return}
 if(m=t.match(/^(?:mark|set|move|change)\s+(.+?)\s+(?:as|to)\s+(lead|talking|mock.?up sent|mock.?up|won|lost|do not contact|dead)$/)){const c=pickOne(m[1]);if(c){const k=m[2].replace(/\s/g,'');const s=/^mock/.test(k)?'Mock-up sent':k=='dead'?'Lost':STAGES.find(x=>x.toLowerCase().replace(/\s/g,'')==k);c.stage=s;if(!open(c)){c.next='';c.action=''}c.updated=today();save();render();say(`${who(c)} is now ${s}.`)}return}
 if(m=t.match(/^(?:note|add note|add a note)\s+(?:to |for |on )?(.+?)\s*[:,]\s*(.+)$/)){const c=pickOne(m[1]);if(c){c.notes=(c.notes?c.notes+' | ':'')+m[2];c.updated=today();save();render();say(`Noted on ${who(c)}.`)}return}
 if(m=t.match(/^(?:tell me about|find|who is|show me|what about|look up)\s+(.+)$/)){const c=pickOne(m[1]);if(c)say(`${who(c)}${c.business&&c.name?', '+c.business:''}. ${c.stage}${c.trade?', '+c.trade:''}.${c.next?' Next: '+when(c.next)+(c.action?', '+c.action:''):' No reminder set.'}${c.notes?' Notes: '+c.notes:''}`);return}
 say("Sorry, I didn't get that. Say help to hear what I can do.")}
function vOpen(){$('#sheet').classList.add('on');if(!$('#vlog').children.length)say(SR?'Hi, tap Mic and tell me who to add or who to chase. Say help for ideas.':'Hi, type what you need. Say help for ideas. (Voice needs Chrome.)');}
function vClose(){$('#sheet').classList.remove('on');vStop();try{speechSynthesis.cancel()}catch(e){}}
function vSend(){const i=$('#vin');const t=i.value.trim();i.value='';if(t)vHandle(t)}
function vStop(){vOn=false;try{vRec&&vRec.stop()}catch(e){}$('#vlis').classList.remove('lis');$('#vlis').textContent='Mic'}
function vListen(){if(!SR){say("Voice isn't available in this browser. Type instead.");return}if(vOn){vStop();return}
 try{speechSynthesis.cancel()}catch(e){}vRec=new SR();vRec.lang='en-GB';vRec.interimResults=false;vRec.maxAlternatives=1;vOn=true;$('#vlis').classList.add('lis');$('#vlis').textContent='Listening…';
 vRec.onresult=e=>{const t=e.results[0][0].transcript;vStop();vHandle(t)};
 vRec.onerror=e=>{vStop();say(e.error==='not-allowed'?'I need microphone permission. Tap the padlock by the address bar and allow the microphone.':e.error==='no-speech'?"I didn't hear anything. Tap Mic and try again.":'Mic problem. You can type instead.')};
 vRec.onend=()=>{if(vOn)vStop()};try{vRec.start()}catch(e){vStop()}}
$('#vin').addEventListener('keydown',e=>{if(e.key==='Enter')vSend()});
