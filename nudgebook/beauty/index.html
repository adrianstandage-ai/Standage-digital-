<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nudgebook for Beauty and Nails</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="robots" content="noindex"><meta name="theme-color" content="#12212B">
<style>
/* ===== THEME: change only this block to re-skin the whole app ===== */
:root{
  --bg:#F4F1EA;            /* page */
  --bg2:#EAE5D9;           /* soft panels, chips */
  --card:#FFFFFF;
  --ink:#12212B;           /* main text */
  --mute:#66727A;          /* secondary text */
  --line:#E3DED2;
  --acc:#C95FA6;           /* main accent (buttons, active tab) */
  --acc-ink:#12212B;       /* text on the accent */
  --hero:#12212B;          /* summary banner */
  --hero2:#24506A;         /* banner gradient end */
  --ring1:#C95FA6;--ring2:#1F8A5B;--ring3:#4F7CE0;   /* activity rings */
  --hero-ink:#FFFFFF;
  --warn:#C8421C;          /* overdue / today */
  --warn-bg:#FBE9E2;
  --ok:#1F8A5B;
  --st-lead:#4F7CE0;--st-talking:#E08A1E;--st-mockup:#8A5CD6;--st-won:#1F8A5B;--st-lost:#8A949A;--st-dnc:#C8421C;
  --radius:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(18,33,43,.06),0 6px 18px rgba(18,33,43,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0E1A22;--bg2:#1A2B36;--card:#16252F;--ink:#EEF2F4;--mute:#9AABB5;--line:#26394A;
  --hero:#C95FA6;--hero2:#FFD65A;--ring1:#C95FA6;--ring2:#4FD19A;--ring3:#7FA2FF;--hero-ink:#12212B;--warn:#FF8F66;--warn-bg:#3A2420;--ok:#4FD19A;
  --st-lead:#7FA2FF;--st-talking:#FFB454;--st-mockup:#B795FF;--st-won:#4FD19A;--st-lost:#8FA0AA;--st-dnc:#FF8F66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
/* ================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);padding-bottom:110px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.date{color:var(--mute);font-size:13px;margin-top:2px}
main{padding:0 16px}
button{font:inherit;cursor:pointer;transition:transform .12s ease,filter .12s ease}
button:active,.btn:active{transform:scale(.96)}
button.add{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:26px;line-height:1;font-weight:600;box-shadow:var(--shadow)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(360px,calc(100% - 28px));display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow);z-index:5}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 6px;background:none;border:0;border-radius:999px;color:var(--mute);font-size:14px;font-weight:600}
.tabs button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 20px;margin:6px 0 6px;box-shadow:var(--shadow)}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .lbl{font-size:15px;opacity:.85;margin-top:6px}
.hero .chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .chips span{background:rgba(255,255,255,.14);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
@media(prefers-color-scheme:dark){.hero .chips span{background:rgba(18,33,43,.14)}}
h2{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin:22px 4px 10px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin:0 0 10px;box-shadow:var(--shadow);position:relative;transition:transform .12s ease}
.card:active{transform:scale(.985)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:var(--st-lead)}
.card[data-st="Talking"] .av{background:var(--st-talking)}.card[data-st="Consultation booked"] .av{background:var(--st-mockup)}
.card[data-st="Won"] .av{background:var(--st-won)}.card[data-st="Lost"] .av{background:var(--st-lost)}.card[data-st="Do not contact"] .av{background:var(--st-dnc)}
.cb{min-width:0;flex:1}
.cb b{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.sub{color:var(--mute);font-size:14px;margin-top:3px}
.due{color:var(--warn);font-weight:700;font-size:14px;margin-top:5px}
.due.late{background:var(--warn-bg);display:inline-block;padding:2px 9px;border-radius:99px}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--mute)}
.pill.st{background:none;color:var(--ink);padding-left:0;display:inline-flex;align-items:center;gap:6px}
.pill.st:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st-lead)}
.card[data-st="Talking"] .pill.st:before{background:var(--st-talking)}.card[data-st="Consultation booked"] .pill.st:before{background:var(--st-mockup)}
.card[data-st="Won"] .pill.st:before{background:var(--st-won)}.card[data-st="Lost"] .pill.st:before{background:var(--st-lost)}.card[data-st="Do not contact"] .pill.st:before{background:var(--st-dnc)}
button.p,.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;display:inline-block;box-shadow:var(--shadow)}
button.s{background:var(--bg2);color:var(--ink);border:0;border-radius:12px;padding:10px 13px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cb .row .btn{padding:10px 14px;box-shadow:none}
.cb .row .btn.wa{background:var(--ok);color:#fff}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 2px 5px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);vertical-align:-4px;margin-right:6px}
.empty{color:var(--mute);text-align:center;padding:40px 10px;font-size:15px}
.empty i{display:block;font-style:normal;font-size:38px;margin-bottom:6px}
textarea.big{height:160px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
.fade{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}*{transition:none!important}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;min-width:0}
.tile .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.tile .t{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.tile.late .n{color:var(--warn)}
.ring{flex:none;width:46px;height:46px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:var(--bg2)}.ring .fg{stroke:var(--acc);transition:stroke-dashoffset .8s ease}
.tile.wide{grid-column:span 2}
.mini{display:flex;gap:6px;align-items:flex-end;height:46px;flex:1}.mini i{flex:1;background:var(--bg2);border-radius:6px 6px 3px 3px;min-height:6px;position:relative}.mini i b{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 3px 3px;background:var(--acc)}
.mlbl{display:flex;gap:6px;font-size:11px;color:var(--mute);font-weight:600;margin-top:4px}.mlbl span{flex:1;text-align:center}
.slot{color:var(--mute);font-size:14px;text-align:center;padding:16px;border:1.5px dashed var(--line);border-radius:var(--radius);margin:0 0 10px}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-width:0}
.gc .t{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.donut{display:block;width:100%;max-width:150px;margin:0 auto;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:13}.donut .seg{animation:seg .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes seg{from{stroke-dasharray:0 251.33}}
.dwrap{position:relative;max-width:150px;margin:0 auto}.dmid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}.dmid b{font-size:28px;font-weight:800}.dmid span{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase}
.ghost{opacity:.3}
.leg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-size:12px;color:var(--mute);font-weight:600;justify-content:center}.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.goalring{display:block;width:100%;max-width:150px;margin:0 auto;transform:rotate(-90deg)}.goalring circle{fill:none;stroke-width:13;stroke-linecap:round}.goalring .bg{stroke:var(--bg2)}.goalring .fg{stroke:var(--acc);animation:seg2 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes seg2{from{stroke-dashoffset:251.33}}
.gsub{text-align:center;font-size:12px;color:var(--mute);font-weight:600;margin-top:8px}
.act{grid-column:span 2}
.bars{display:flex;gap:8px;align-items:flex-end;height:92px}.bars .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mute)}
.bars .c u{width:100%;display:block;text-decoration:none;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 60%,var(--st-talking)));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;min-height:4px}
.bars .c.today u{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
@keyframes grow{from{transform:scaleY(0)}}
.hello{font-size:15px;opacity:.9;margin-bottom:4px;font-weight:600}
@media(prefers-reduced-motion:reduce){.donut .seg,.goalring .fg,.bars .c u{animation:none}}
/* ===== DASHBOARD v3 ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero),var(--hero2));display:flex;gap:10px;align-items:center;justify-content:space-between}
.hero:before,.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);animation:drift 11s ease-in-out infinite alternate;pointer-events:none}
.hero:before{left:-60px;top:-90px}.hero:after{right:-70px;bottom:-110px;animation-duration:14s;animation-delay:-5s}
@keyframes drift{to{transform:translate(50px,36px) scale(1.15)}}
.hero>*{position:relative;z-index:1}
.hero .txt{min-width:0}
.hero .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero .live i{width:8px;height:8px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.rings{flex:none;width:128px;height:128px;position:relative}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.rings circle{fill:none;stroke-width:8;stroke-linecap:round}
.rings .tr{stroke:rgba(255,255,255,.16)}.rings .rg{stroke-dasharray:var(--c);animation:ringin 1.3s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-color-scheme:dark){.rings .tr{stroke:rgba(18,33,43,.16)}}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
.rings .r1{stroke:var(--ring1);filter:drop-shadow(0 0 4px var(--ring1))}.rings .r2{stroke:var(--ring2);filter:drop-shadow(0 0 4px var(--ring2));animation-delay:.15s}.rings .r3{stroke:var(--ring3);filter:drop-shadow(0 0 4px var(--ring3));animation-delay:.3s}
.hero .rings .r1{stroke:#fff}.hero .rings .r2{stroke:#7CF5B4}.hero .rings .r3{stroke:#8FB6FF}
@media(prefers-color-scheme:dark){.hero .rings .r1{stroke:#12212B}.hero .rings .r2{stroke:#0B6B45}.hero .rings .r3{stroke:#274BB0}}
.hero .rings circle{filter:none}
.rleg{display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:10px;font-size:12px;font-weight:700}
.rleg span{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:99px}
@media(prefers-color-scheme:dark){.rleg span{background:rgba(18,33,43,.14)}}
.rleg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.xp{height:7px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:10px;overflow:hidden}.xp b{display:block;height:100%;border-radius:99px;background:#fff;animation:xpin 1.2s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-color-scheme:dark){.xp{background:rgba(18,33,43,.2)}.xp b{background:#12212B}}
@keyframes xpin{from{width:0!important}}
.lvl{font-size:12px;font-weight:700;margin-top:6px;opacity:.9;display:flex;justify-content:space-between}
.mom{padding:14px 14px 10px}.mom svg{width:100%;height:96px;display:block;overflow:visible}
.mom .ln{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw 1.5s cubic-bezier(.4,0,.2,1) both;filter:drop-shadow(0 3px 5px color-mix(in srgb,var(--acc) 55%,transparent))}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.mom .ar{opacity:0;animation:fadein .9s .8s ease both}@keyframes fadein{to{opacity:1}}
.mom .dot{fill:var(--acc);stroke:var(--card);stroke-width:3;opacity:0;animation:fadein .4s 1.4s ease both}
.mom .pulse{fill:var(--acc);opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2s 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.mom .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.mhead{display:flex;justify-content:space-between;align-items:baseline}.mhead b{font-size:22px;font-weight:800}
.gauge{display:block;width:100%;max-width:170px;margin:0 auto}
.gauge path{fill:none;stroke-width:11;stroke-linecap:round}
.gauge .nd{transform-origin:50px 50px;transform-box:view-box;animation:needle 1.4s cubic-bezier(.3,1.4,.4,1) both}
@keyframes needle{from{transform:rotate(-90deg)}}
.gnum{text-align:center;font-size:26px;font-weight:800;margin-top:-4px}
.pipe{margin:10px 0 4px}.pbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--bg2);margin:8px 0}
.pbar i{display:block;height:100%;transform-origin:left;animation:growx 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.pl{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:700;color:var(--mute)}.pl span{display:flex;flex-direction:column}.pl b{color:var(--ink);font-size:15px}
.heat{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:8px}.heat i{aspect-ratio:1;border-radius:5px;background:var(--bg2);display:block;animation:pop .4s both}
.heat i.t{outline:2px solid var(--acc);outline-offset:1px}
@keyframes pop{from{transform:scale(0)}}
.streak{display:flex;align-items:center;gap:10px}.streak .fire{font-size:30px;animation:flame 1.6s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes flame{to{transform:scale(1.14) rotate(-4deg)}}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;font-size:15px;box-shadow:var(--shadow);animation:toast 1.7s ease both;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,14px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-16px)}}
.conf{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.conf i{position:absolute;width:9px;height:14px;border-radius:2px;animation:conf 1.3s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@media(prefers-reduced-motion:reduce){.hero:before,.hero:after,.streak .fire,.mom .ln,.mom .pulse,.rings .rg,.xp b,.gauge .nd,.pbar i,.heat i{animation:none!important}.mom .ar,.mom .dot{opacity:1}.mom .ln{stroke-dashoffset:0}}
/* ===== VOICE ===== */
.mic{position:fixed;right:18px;bottom:96px;z-index:30;width:58px;height:58px;border-radius:50%;border:0;background:var(--hero);color:var(--hero-ink);box-shadow:var(--shadow),0 8px 22px rgba(0,0,0,.22);display:grid;place-items:center}
.mic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.28);padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:78vh;display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet .top b{font-size:17px}
.log{overflow:auto;flex:1;min-height:90px;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.bub{max-width:86%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.35;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:5px}
.bub.bot{align-self:flex-start;background:var(--bg2);color:var(--ink);border-bottom-left-radius:5px}
.vrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.vrow input{flex:1}
.vrow button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;background:var(--bg2);color:var(--ink)}
.vrow button.go{background:var(--acc);color:var(--acc-ink)}
.vrow button.lis{background:var(--warn);color:#fff}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.bar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:5px 0 12px}.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.frow{display:flex;justify-content:space-between;font-size:14px;font-weight:600}.frow span:last-child{color:var(--mute);font-weight:500}
.stg{font-size:15px;font-weight:800;margin:18px 2px 8px;display:flex;justify-content:space-between}.stg span{color:var(--mute);font-weight:600}
.nb{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--warn);color:#fff;font-size:11px;font-weight:800;place-items:center;line-height:1}
.tabs button{white-space:nowrap;gap:4px;padding:11px 3px;font-size:13px}.tabs button svg{width:16px;height:16px}
</style></head><body><div class="wrap">
