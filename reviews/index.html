<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8"><link rel="canonical" href="https://standagedigital.co.uk/reviews/">
<meta property="og:url" content="https://standagedigital.co.uk/reviews/">
<meta property="og:title" content="Reviews | Standage Digital">
<meta property="og:image" content="https://standagedigital.co.uk/img/examples/board-restaurant.webp">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reviews | Standage Digital</title>
<meta name="description" content="Worked with Standage Digital? Leave a review. Every review is read before it goes on the site.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#F5F7F6;--surface:#fff;--ink:#12212B;--muted:#55636C;--line:#DCE3E0;--accent:#DDB44A;--accent-ink:#12212B;--display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0A1B3A;--surface:#112A52;--ink:#E9EEF0;--muted:#A3B3CC;--line:#223F6E;--accent:#E6BC4E;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:660px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 60px}
h1,h3{font-family:var(--display);line-height:1.06;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(2rem,9vw,3rem);font-weight:800}
p{margin:0}.small{font-size:.88rem;color:var(--muted)}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 22px;border-radius:999px;font:600 1rem var(--body);border:2px solid transparent;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,#F6DA85 0%,var(--accent) 45%,#B98F2C 100%);color:var(--accent-ink)}
.btn.alt{background:transparent;border-color:var(--line);color:inherit}
.btn[disabled]{opacity:.6}
/* reviews block */
.rvw{display:grid;gap:18px;margin-top:22px}
.rvw-list{display:grid;gap:14px}.rvw-list:empty{display:none}
.rvw-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.rvw-stars{color:var(--accent);letter-spacing:3px;font-size:1.15rem;line-height:1}
.rvw-card p{margin:.7em 0 .9em}.rvw-card b{display:block}.rvw-card small{color:var(--muted)}
.rvw-form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px}
.rvw-form h3{font-size:1.5rem;font-weight:800}
.rvw-form label{display:grid;gap:6px;font-weight:600}
.rvw-form input[type=text],.rvw-form textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
.rvw-form textarea{min-height:130px;resize:vertical}
.rvw-form input:focus,.rvw-form textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.rvw-pick{display:flex;gap:4px}
.rvw-star{appearance:none;-webkit-appearance:none;background:none;border:0;padding:6px 8px;margin:0;font:inherit;font-size:2.4rem;line-height:1;color:var(--muted);opacity:.45;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-width:48px;min-height:48px}
.rvw-star.on{color:var(--accent);opacity:1}
.rvw-star:focus-visible{outline:3px solid var(--accent);border-radius:8px}
.rvw-ok{display:flex!important;align-items:flex-start;gap:10px;font-weight:400!important;font-size:.95rem}
.rvw-ok input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--accent)}
.rvw-hp{position:absolute;left:-9999px}
.rvw-msg{font-weight:600}.rvw-msg.err{color:#e06a5a}
.rvw-thanks{text-align:center;padding:18px 6px;display:grid;gap:10px;justify-items:center}.rvw-thanks b{font-size:1.4rem}
.rvw-google{text-align:center;display:grid;gap:10px;justify-items:center}

/* showcase */
.hero{padding:6px 0 4px}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sum{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:600;min-height:34px}
.sum .st{color:var(--accent);letter-spacing:3px;font-size:1.5rem;line-height:1}
.shown{display:grid;gap:16px;margin-top:22px}
.q{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 22px 22px;overflow:hidden;animation:qin .5s both}
.q::before{content:"\201C";position:absolute;right:16px;top:-14px;font:800 7rem/1 var(--display);color:var(--accent);opacity:.22;pointer-events:none}
.q .st{color:var(--accent);letter-spacing:3px;font-size:1.2rem;line-height:1}
.q blockquote{margin:.8em 0 1em;font:700 clamp(1.2rem,5.2vw,1.55rem)/1.3 var(--display);letter-spacing:-.01em;text-wrap:pretty}
.q cite{font-style:normal;display:block;font-weight:600}.q cite small{display:block;color:var(--muted);font-weight:400}
.q:first-child{border-color:var(--accent)}
@keyframes qin{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.q{animation:none}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:22px;padding:26px 22px;text-align:center;display:grid;gap:8px}
.empty b{font:800 1.4rem var(--display)}
.cta{margin-top:26px;display:grid;gap:10px;justify-items:start}
#reviews .rvw-list{display:none}
#reviews .rvw-form{display:none;margin-top:18px}
#reviews.rvw-open .rvw-form{display:grid;animation:qin .35s both}
</style></head><body>
<div class="wrap"><div class="top"><a href="/" style="text-decoration:none">← Standage Digital</a></div>
<div class="hero"><span class="eyebrow">Reviews</span>
<h1 style="margin-top:8px">What clients say</h1>
<div class="sum" id="sum" aria-live="polite"></div></div>
<div class="shown" id="shown"></div>
<div class="cta"><button class="btn" id="leave" type="button" aria-expanded="false" aria-controls="reviews">Leave a review</button>
<p class="small">Worked with me? A few honest words really help. I read every review before it goes on the site.</p></div>
<div id="reviews" data-email="hello@standagedigital.co.uk" data-name="Standage Digital" data-google="" data-api="https://sd-reviews.adrianstandage.workers.dev/api/review" data-list="https://sd-reviews.adrianstandage.workers.dev/api/reviews" data-whatsapp="447751435993" data-approve-text="To put this on the website: paste this email into your Claude project chat and say YES."></div>
</div>
<script src="reviews.js?v=8"></script>
<script>
(function(){
var root=document.getElementById('reviews'),shown=document.getElementById('shown'),sum=document.getElementById('sum'),btn=document.getElementById('leave');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function stars(n){return new Array(Math.max(1,Math.min(5,n|0))+1).join('\u2605')}
btn.addEventListener('click',function(){var o=root.classList.toggle('rvw-open');btn.setAttribute('aria-expanded',o);btn.textContent=o?'Close':'Leave a review';if(o){var f=root.querySelector('.rvw-form');if(f)setTimeout(function(){f.scrollIntoView({behavior:'smooth',block:'start'})},60)}});
function empty(){var e=el('div','empty');e.appendChild(el('b',null,'No reviews yet'));e.appendChild(el('p','small','Every review is read by me before it appears here. Be the first.'));shown.appendChild(e)}
fetch(root.dataset.list,{cache:'no-store'}).then(function(r){return r.json()}).then(function(a){
 if(!a||!a.length){empty();return}
 var t=0;a.forEach(function(r){t+=Math.max(1,Math.min(5,r.rating|0));
  var c=el('article','q');c.appendChild(el('div','st',stars(r.rating)));c.appendChild(el('blockquote',null,r.text));
  var ci=el('cite',null,r.name);if(r.role)ci.appendChild(el('small',null,r.role));c.appendChild(ci);shown.appendChild(c)});
 var avg=(t/a.length).toFixed(1).replace(/\.0$/,'');
 sum.appendChild(el('span','st',stars(Math.round(t/a.length))));sum.appendChild(el('span',null,avg+' out of 5 from '+a.length+(a.length==1?' review':' reviews')));
}).catch(empty);
})();
</script>
</body></html>
