<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8"><link rel="canonical" href="https://standagedigital.co.uk/reviews/">
<meta property="og:url" content="https://standagedigital.co.uk/reviews/">
<meta property="og:title" content="Reviews | Standage Digital">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reviews | Standage Digital</title>
<meta name="description" content="Worked with Standage Digital? Leave a review. Every review is read before it goes on the site.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#F5F7F6;--surface:#fff;--ink:#12212B;--muted:#55636C;--line:#DCE3E0;--accent:#DDB44A;--accent-ink:#12212B;--display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0A1B3A;--surface:#112A52;--ink:#E9EEF0;--muted:#A3B3CC;--line:#223F6E;--accent:#E6BC4E;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:660px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 60px}
h1,h3{font-family:var(--display);line-height:1.06;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(2rem,9vw,3rem);font-weight:800}
p{margin:0}.small{font-size:.88rem;color:var(--muted)}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 22px;border-radius:999px;font:600 1rem var(--body);border:2px solid transparent;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,#F6DA85 0%,var(--accent) 45%,#B98F2C 100%);color:var(--accent-ink)}
.btn.alt{background:transparent;border-color:var(--line);color:inherit}
.btn[disabled]{opacity:.6}
/* reviews block */
.rvw{display:grid;gap:18px;margin-top:22px}
.rvw-list{display:grid;gap:14px}.rvw-list:empty{display:none}
.rvw-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.rvw-stars{color:var(--accent);letter-spacing:3px;font-size:1.15rem;line-height:1}
.rvw-card p{margin:.7em 0 .9em}.rvw-card b{display:block}.rvw-card small{color:var(--muted)}
.rvw-form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px}
.rvw-form h3{font-size:1.5rem;font-weight:800}
.rvw-form label{display:grid;gap:6px;font-weight:600}
.rvw-form input[type=text],.rvw-form textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
.rvw-form textarea{min-height:130px;resize:vertical}
.rvw-form input:focus,.rvw-form textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.rvw-pick{display:flex;gap:4px}
.rvw-star{appearance:none;-webkit-appearance:none;background:none;border:0;padding:6px 8px;margin:0;font:inherit;font-size:2.4rem;line-height:1;color:var(--muted);opacity:.45;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-width:48px;min-height:48px}
.rvw-star.on{color:var(--accent);opacity:1}
.rvw-star:focus-visible{outline:3px solid var(--accent);border-radius:8px}
.rvw-ok{display:flex!important;align-items:flex-start;gap:10px;font-weight:400!important;font-size:.95rem}
.rvw-ok input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--accent)}
.rvw-hp{position:absolute;left:-9999px}
.rvw-msg{font-weight:600}.rvw-msg.err{color:#e06a5a}
.rvw-thanks{text-align:center;padding:18px 6px;display:grid;gap:10px;justify-items:center}.rvw-thanks b{font-size:1.4rem}
.rvw-google{text-align:center;display:grid;gap:10px;justify-items:center}
</style></head><body>
<div class="wrap"><div class="top"><a href="/" style="text-decoration:none">← Standage Digital</a></div>
<h1>Reviews</h1>
<p style="margin-top:10px" class="small">Worked with me? A few honest words really help. I read every review before it goes on the site.</p>

</div>

</body></html>
